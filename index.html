  <body>
    <div id="map" aria-label="Map of walking reach"></div>
    <aside id="panel">
      <header>
        <h1>15 minutes, but for whom?</h1>
        <p class="sub" id="area-name"></p>
      </header>
      <p id="hint" class="hint">Tap or click anywhere on the map to start from there.</p>
      <p id="explain" class="explain" aria-live="polite"></p>

      <section aria-label="Who is walking">
        <h2>Who is walking</h2>
        <ul id="legend" class="legend"></ul>
        <p class="bands">Line strength: <b>5</b> min (solid) · <b>10</b> min · <b>15</b> min (faint)</p>
      </section>

      <section aria-label="Conditions">
        <h2>Conditions</h2>
        <label><input type="checkbox" id="c-heat" /> Heat (high heat index)</label>
        <label><input type="checkbox" id="c-rain" /> Rain</label>
        <label class="sub-opt"><input type="checkbox" id="c-avoid" /> …and avoid uncovered streets</label>
        <label><input type="checkbox" id="c-slopes" /> Slopes (Tobler penalty)</label>
        <label><input type="checkbox" id="c-lifts" /> Broken lifts (no stairs or footbridges)</label>
      </section>
